<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEE2">
<title>MSC 郵輪・沖繩跳島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════ 調色盤：沖繩旅遊海報 ══════════
   天空藍 + 珊瑚紅標題 + 米白紙張 + 深海藍文字與圖示（單色） */
:root{
  --sky:#86CBEA; --sky-l:#E4F2F9; --sea:#2C84B0;
  --navy:#1E4E6A; --navy-d:#163A50;
  --ink:#1F3341; --ink2:#4E6372; --ink3:#8696A2;
  --coral:#E35E45; --coral-d:#C44A33; --coral-l:#FBE6DF;
  --cream:#F4EEE2; --paper:#FFFDF8;
  --line:rgba(30,78,106,.13); --line2:rgba(30,78,106,.28);
  --r:14px;
  --dis:"Oswald","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);color:var(--ink);line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%;display:block}
a{color:var(--navy)}
button{font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.hide{display:none!important}

/* 單色圖示：全部吃 currentColor */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round;vertical-align:-.15em;flex:0 0 auto;overflow:visible}
.ic.big{font-size:42px;stroke-width:1.3;color:var(--navy)}

/* ══════════ 封面海報 ══════════ */
.cover{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 0}
.frame{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:11px 11px 6px}
.poster{position:relative;border-radius:14px;overflow:hidden;height:clamp(350px,96vw,480px);
  background:linear-gradient(#7DC4E6,#CFEBF6 80%)}
.poster .art{position:absolute;inset:0;width:100%;height:100%}
.ptop{position:relative;padding:18px 18px 0}
.poster{--n:4;--ds:clamp(40px,calc((100vw - 104px) / (var(--n) * 1.06)),96px)}
.display{white-space:nowrap;font:900 var(--ds)/1 "Noto Sans TC",sans-serif;color:var(--coral);letter-spacing:.03em;margin-left:-3px}
.display.latin{font:600 calc(var(--ds)*1.08)/.86 var(--dis);letter-spacing:.005em;text-transform:uppercase;margin-left:-2px}
.ptag{font:700 11px/1.3 var(--dis);letter-spacing:.2em;color:var(--navy);margin-top:12px}
.prule{display:flex;align-items:center;gap:10px;margin-top:8px;max-width:270px}
.prule i{flex:1;height:1px;background:var(--coral)}
.prule b{color:var(--coral-d);font-size:13px;font-weight:900;letter-spacing:.14em;white-space:nowrap}
.vtext{position:absolute;left:20px;top:calc(var(--ds) + 82px);
  writing-mode:vertical-rl;font-weight:700;font-size:15px;letter-spacing:.26em;color:var(--navy);line-height:1.7}
.stamp{position:absolute;right:16px;top:calc(var(--ds) + 68px);width:90px;height:90px;color:#fff}
.seal{position:absolute;right:12px;bottom:12px;writing-mode:vertical-rl;border:1.5px solid var(--coral);
  color:var(--coral);background:rgba(255,253,248,.94);font-size:11px;font-weight:900;letter-spacing:.24em;
  padding:8px 4px;border-radius:2px}
.strip{display:grid;grid-template-columns:1fr 1fr 1fr;margin:12px 0 4px}
.strip .c b span{white-space:nowrap}
.strip .c{display:flex;gap:9px;align-items:center;padding:4px 10px;border-left:1px solid var(--line2);min-width:0}
.strip .c:first-child{border-left:0;padding-left:6px}
.strip .c .ic{font-size:26px;color:var(--navy);stroke-width:1.4}
.strip .c small{display:block;white-space:nowrap;font-size:10.5px;color:var(--ink3);letter-spacing:.06em;line-height:1.3}
.strip .c b{display:block;font-size:13.5px;color:var(--navy);line-height:1.3;font-weight:900}
.strip .c.hot .ic,.strip .c.hot b{color:var(--coral)}
.subline{text-align:center;font-size:11.5px;color:var(--ink3);letter-spacing:.1em;margin:8px 0 2px}

/* ══════════ 分頁列 ══════════ */
.tabbar{position:sticky;top:0;z-index:40;margin-top:12px;background:var(--cream);
  background:color-mix(in srgb,var(--cream) 94%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.tabbar .inner{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;justify-content:space-between}
.tabbar .inner::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink3);
  font-size:13.5px;font-weight:700;padding:12px 6px 10px;border-bottom:2.5px solid transparent;
  cursor:pointer;white-space:nowrap;transition:.15s}
.tab .ic{font-size:16px}
.tab{gap:4px}
.tab.on{color:var(--navy);border-bottom-color:var(--coral)}

/* ══════════ 共用 ══════════ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.sec{margin:18px 0}
.sh{display:flex;align-items:flex-end;gap:12px;margin:24px 0 12px}
.sh .k{display:block;font:600 13px/1 var(--dis);letter-spacing:.12em;color:var(--coral);margin-bottom:5px}
.sh h3{margin:0;font-size:17px;font-weight:900;color:var(--navy);letter-spacing:.06em;line-height:1.2}
.sh .rl{flex:1;height:1px;background:var(--line2);margin-bottom:6px}
.sh small{font-size:11.5px;color:var(--ink3);margin-bottom:2px;white-space:nowrap}
.muted{color:var(--ink3);font-size:13px}
.loading{padding:40px 0;text-align:center;color:var(--ink3);font-size:14px}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--navy);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--coral-l);border:1px solid rgba(227,94,69,.3);color:var(--coral-d);padding:14px 16px;
  border-radius:12px;font-size:13.5px;margin:14px 0;line-height:1.7}
.err b{display:block;margin-bottom:4px}
.btn{border:0;background:var(--navy);color:var(--paper);font-weight:700;font-size:14px;
  padding:11px 18px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--navy);border:1.5px solid var(--line2)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);color:var(--navy);
  border-radius:99px;padding:1px 9px 1px 7px;font-size:11.5px;font-weight:700;line-height:1.7}
.tag .ic{font-size:12.5px;stroke-width:2}
.tag.soft{border-color:transparent;background:var(--sky-l)}
.empty{padding:34px 20px;text-align:center}
.empty p{margin:10px 0 0}

/* ══════════ 行程 ══════════ */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:9px 13px 9px;cursor:pointer;min-width:94px;transition:.15s}
.day b{display:block;font:600 21px/1 var(--dis);color:var(--coral);letter-spacing:.02em}
.day span{display:block;font-size:10.5px;color:var(--ink3);margin-top:4px;line-height:1.3}
.day .pt{color:var(--navy);font-weight:700;font-size:12px;margin-top:2px}
.day.on{background:var(--navy);border-color:var(--navy)}
.day.on b{color:#FFC4B6}
.day.on span{color:rgba(255,253,248,.72)}
.day.on .pt{color:var(--paper)}
.dayhead{display:flex;gap:15px;align-items:center;padding:14px 16px;margin-bottom:16px}
.dayhead .no{font:600 44px/.85 var(--dis);color:var(--coral);letter-spacing:.01em}
.dayhead .k{font:500 11.5px/1.2 var(--dis);letter-spacing:.12em;color:var(--ink3)}
.dayhead h4{margin:5px 0 0;font-size:17px;color:var(--navy);font-weight:900;line-height:1.25}
.dayhead .nt{font-size:12.5px;color:var(--ink2);margin-top:4px}
.dayhead .ab{margin-top:6px;color:var(--coral);font-weight:900;font-size:13px;display:flex;gap:5px;align-items:center}
.tl{position:relative}
.tl-item{display:grid;grid-template-columns:50px 1fr;gap:10px}
.tl-time{text-align:right;padding-top:13px}
.tl-time b{display:block;font:600 15px/1.1 var(--dis);color:var(--navy);letter-spacing:.02em}
.tl-time span{font:400 11px var(--dis);color:var(--ink3);letter-spacing:.04em}
.tl-body{position:relative;padding:0 0 12px 18px;border-left:1.5px dashed var(--line2)}
.tl-item:last-child .tl-body{border-left-color:transparent}
.tl-dot{position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--coral)}
.tl-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tl-card h4{margin:0;font-size:15px;font-weight:900;line-height:1.45;color:var(--ink)}
.tl-card .desc{margin:6px 0 0;font-size:13px;color:var(--ink2);white-space:pre-wrap}
.tl-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.tl-foot{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;padding-top:9px;
  border-top:1px dashed var(--line2);font-size:12px;color:var(--ink2)}
.tl-foot>*{display:inline-flex;align-items:center;gap:4px}
.tl-foot .ic{color:var(--navy);font-size:14px}
.tl-foot a{text-decoration:none;font-weight:700}

/* ══════════ 郵輪 ══════════ */
.ticket{display:grid;grid-template-columns:1fr 96px;background:var(--navy);color:var(--paper);
  border-radius:14px;position:relative;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;right:96px;width:18px;height:18px;
  border-radius:50%;background:var(--cream);transform:translateX(50%)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket.warn{background:var(--coral)}
.ticket .main{padding:16px 16px 15px;min-width:0}
.ticket .kk{display:flex;align-items:center;gap:6px;font:700 12px/1.2 "Noto Sans TC",sans-serif;letter-spacing:.14em;opacity:.85}
.ticket .big{font:600 50px/1 var(--dis);margin:9px 0 6px;letter-spacing:.01em}
.ticket .big.zh{font:900 30px/1.2 "Noto Sans TC",sans-serif;margin:10px 0 6px;letter-spacing:.04em}
.ticket .sm{font-size:12.5px;opacity:.85;line-height:1.55}
.ticket .stub{border-left:1.5px dashed rgba(255,253,248,.4);padding:14px 8px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.ticket .stub .ic{font-size:22px;opacity:.85}
.ticket .stub .dno{font:600 26px/1 var(--dis);color:#FFC4B6}
.ticket.warn .stub .dno{color:var(--paper)}
.ticket .stub small{font-size:11px;opacity:.8;line-height:1.3}
.route{padding:4px 0}
.port{display:grid;grid-template-columns:56px 22px 1fr auto;gap:10px;align-items:start;padding:12px 14px 12px 12px}
.port .d{font:600 17px/1 var(--dis);color:var(--coral);padding-top:3px}
.port .d small{display:block;font:400 10.5px/1.4 "Noto Sans TC";color:var(--ink3);margin-top:4px;white-space:nowrap}
.port .nd{position:relative;align-self:stretch;display:flex;justify-content:center}
.port .nd .ic{font-size:20px;color:var(--navy);background:var(--paper);position:relative;z-index:1;stroke-width:1.6}
.port .nd::after{content:"";position:absolute;left:50%;top:24px;bottom:-16px;border-left:1.5px dashed var(--line2)}
.port:last-child .nd::after{display:none}
.port .n{font-weight:900;font-size:14.5px;color:var(--navy);line-height:1.4}
.port .n small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px;margin-top:3px}
.port .t{text-align:right;font-size:12px;white-space:nowrap;line-height:1.6}
.port .t b{display:block;font:500 13px var(--dis);letter-spacing:.04em;color:var(--navy)}
.port .t .rb{color:var(--coral);font-weight:900}
.port.now{background:var(--sky-l)}
.port.now .nd .ic{background:var(--sky-l)}
.info-g{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;padding:14px 16px;font-size:13.5px;margin:0}
.info-g dt{display:flex;gap:7px;align-items:center;color:var(--ink3);font-weight:700;white-space:nowrap}
.info-g dt .ic{color:var(--navy);font-size:16px}
.info-g dd{margin:0;white-space:pre-wrap;color:var(--ink)}

/* ══════════ 分帳 ══════════ */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 8px 11px;text-align:center}
.stat b{display:block;font:600 19px/1.2 var(--dis);color:var(--navy);letter-spacing:.01em}
.stat span{font-size:11px;color:var(--ink3)}
.bal{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
  border-bottom:1px solid var(--line);font-size:14px}
.bal:last-child{border-bottom:0}
.bal .who{font-weight:700;display:flex;gap:7px;align-items:center}
.bal .who .ic{color:var(--navy)}
.bal .who em{font-style:normal;color:var(--ink3);font-size:11.5px;font-weight:500}
.bal .amt{font:600 16px var(--dis);letter-spacing:.02em}
.pos{color:var(--navy)} .neg{color:var(--coral)}
.settle{background:var(--sky-l);border:1px solid rgba(44,132,176,.18);border-radius:12px;
  padding:11px 14px;font-size:13.5px;line-height:2}
.settle .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.settle .row .ic{color:var(--navy)}
.settle .row .amt{margin-left:auto;font:600 15px var(--dis);color:var(--navy)}
.exp-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.exp-item:last-child{border-bottom:0}
.exp-item h5{margin:0;font-size:14.5px;font-weight:700}
.exp-item .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.exp-item .money{text-align:right;font:600 16px var(--dis);color:var(--navy);white-space:nowrap}
.exp-item .money small{display:block;font:400 11px var(--dis);color:var(--ink3)}
.exp-item.done{opacity:.5}

/* ══════════ 購物／想去／行前 ══════════ */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters select,.filters input{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;
  font-size:14px;font-family:inherit;background:var(--paper);color:var(--ink);width:100%}
.filters .full{grid-column:1/-1}
.filters select:focus,.filters input:focus,#lock input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px var(--sky-l)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:.3s}
.cb{width:22px;height:22px;border:1.5px solid var(--line2);border-radius:6px;background:var(--paper);
  cursor:pointer;flex:0 0 auto;margin-top:2px;position:relative;transition:.15s;padding:0}
.cb.on{background:var(--navy);border-color:var(--navy)}
.cb.on::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10.5px;
  border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(42deg)}
.grp-h{display:flex;align-items:center;gap:7px;padding:9px 14px;background:var(--sky-l);color:var(--navy);
  font-weight:900;font-size:13px;border-bottom:1px solid var(--line)}
.grp-h .ic{font-size:15px}
.grp-h small{font-weight:500;color:var(--ink3);margin-left:auto}
#sh-box,#pl-box{border-radius:var(--r);overflow:hidden}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:11px;padding:12px 14px;
  border-bottom:1px solid var(--line);align-items:start}
.shop:last-child{border-bottom:0}
.shop.done .name{text-decoration:line-through;color:var(--ink3)}
.shop .name{font-size:14.5px;font-weight:700;line-height:1.45}
.shop .who{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.links{display:flex;gap:12px;margin-top:6px;font-size:12px}
.links a{text-decoration:none;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--sky-l);
  border:1px solid var(--line);cursor:zoom-in}
.place{padding:12px 14px;border-bottom:1px solid var(--line)}
.place:last-child{border-bottom:0}
.place h5{margin:0;font-size:14.5px;font-weight:700;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.place h5 .tag{flex:0 0 auto;margin-top:1px}
.place .mi{font-size:11.5px;color:var(--ink3);margin-top:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bag{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.bag:last-child{border-bottom:0}
.bag .n{font-size:14px;font-weight:700}
.bag .n small{display:flex;gap:4px;align-items:center;color:var(--ink3);font-size:11.5px;font-weight:400}
.bag .ppl{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pbox{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line2);background:var(--paper);
  font-size:11.5px;font-weight:900;color:var(--ink3);cursor:pointer;transition:.15s;padding:0}
.pbox.on{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.refs{padding:10px 16px;font-size:13px;line-height:1.9}
.refs div{display:flex;gap:6px;align-items:center;padding:2px 0}
.refs .ic{color:var(--navy)}

/* ══════════ 通行碼／燈箱／Toast ══════════ */
#lock{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(#7DC4E6,#CFEBF6)}
#lock.on{display:flex}
#lock .box{background:var(--paper);border-radius:18px;padding:28px 24px 24px;width:100%;max-width:340px;
  text-align:center;border:1px solid var(--line)}
#lock .word{font:900 40px/1.1 "Noto Sans TC",sans-serif;color:var(--coral);letter-spacing:.04em;margin-bottom:8px}
#lock .word.latin{font:600 54px/.9 var(--dis);text-transform:uppercase}
#lock .ic{font-size:26px;color:var(--navy)}
#lock h2{margin:8px 0 2px;font-size:16px;font-weight:900;color:var(--navy)}
#lock p{margin:0 0 16px;font-size:13px;color:var(--ink3)}
#lock input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:13px 14px;background:#fff;
  font-size:17px;font-family:inherit;text-align:center;letter-spacing:2px;margin-bottom:10px}
#lock .btn{width:100%}
#lock .msg{margin-top:12px;font-size:13px;font-weight:700;color:var(--coral);min-height:19px}
#lb{position:fixed;inset:0;background:rgba(22,58,80,.94);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:86vh;border-radius:10px}
#lb .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:var(--paper);
  font-size:14px;font-weight:700;padding:0 24px}
/* 店員卡 */
.shop{cursor:pointer}
.shop .go{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--navy);
  background:var(--sky-l);border:1px solid var(--line);font-size:15px}
:is(#sk,#fm){position:fixed;inset:0;z-index:190;display:none}
:is(#sk,#fm).on{display:block}
:is(#sk,#fm) .bk{position:absolute;inset:0;background:rgba(22,58,80,.55);animation:fadeIn .2s both}
:is(#sk,#fm) .sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;
  background:var(--paper);border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  animation:skUp .34s cubic-bezier(.2,.8,.2,1) both;overscroll-behavior:contain}
:is(#sk,#fm) .grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:8px auto 0}
:is(#sk,#fm) .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;z-index:2;
  background:rgba(255,253,248,.92);color:var(--navy);font-size:18px;display:grid;place-items:center;cursor:pointer}
#sk .pic{margin:10px 14px 0;border-radius:14px;overflow:hidden;background:var(--sky-l);border:1px solid var(--line)}
#sk .pic img{display:block;width:100%;max-height:42vh;object-fit:contain;cursor:zoom-in;background:#fff}
#sk .pic .none{padding:22px 16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
#sk .pic .none .ic{font-size:30px;color:var(--navy);opacity:.6}
#sk .pic .none a{font-weight:700}
:is(#sk,#fm) .bd{padding:14px 18px 0}
#sk .nm{font-size:18px;font-weight:900;color:var(--navy);line-height:1.4}
#sk .jpn{font:700 15px/1.4 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;color:var(--coral-d);margin-top:2px}
#sk .jpn:empty{display:none}
#sk .mt{font-size:12px;color:var(--ink3);margin-top:5px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#sk .say{margin-top:14px;border:1.5px solid var(--coral);border-radius:14px;padding:12px 14px 12px;background:#fff;position:relative}
#sk .say .lbl{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--coral)}
#sk .say .ja{font:800 clamp(21px,6vw,26px)/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  color:var(--ink);margin-top:6px;word-break:keep-all;overflow-wrap:anywhere}
#sk .say .zh{font-size:13px;color:var(--ink3);margin-top:4px}
#sk .qty{display:none;align-items:center;gap:10px;margin-top:10px}
#sk .qty.on{display:flex}
#sk .qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line2);background:var(--paper);
  font-size:18px;font-weight:900;color:var(--navy);cursor:pointer}
#sk .qty b{min-width:22px;text-align:center;font:600 20px var(--dis);color:var(--navy)}
#sk .speak{margin-top:12px;width:100%;border:0;border-radius:11px;padding:11px;background:var(--navy);color:var(--paper);
  font:700 14px inherit;font-family:inherit;display:flex;gap:7px;align-items:center;justify-content:center;cursor:pointer}
#sk .speak.on{background:var(--coral)}
#sk .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
#sk .chips button{border:1.5px solid var(--line2);background:var(--paper);color:var(--ink2);border-radius:99px;
  padding:6px 12px;font:700 12.5px inherit;font-family:inherit;cursor:pointer}
#sk .chips button.on{background:var(--navy);border-color:var(--navy);color:var(--paper)}
#sk .acts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:16px;font-size:12.5px}
#sk .acts a{text-decoration:none;font-weight:700;display:inline-flex;gap:4px;align-items:center}
#sk .acts .bought{margin-left:auto;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);
  border-radius:99px;padding:8px 14px;font:800 13px inherit;font-family:inherit;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
#sk .acts .bought.on{background:var(--navy);color:var(--paper)}
@keyframes skUp{from{transform:translateY(100%)}to{transform:none}}
/* 行前：倒數、翻面卡、每人進度圈、打包卡、待辦 */
#prep-count .go{background:var(--navy);color:var(--paper);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;
  align-items:center;margin:4px 0 6px;position:relative;overflow:hidden}
#prep-count .go::after{content:'';position:absolute;left:-10%;right:-10%;bottom:-14px;height:30px;border-radius:50%;
  background:rgba(134,203,234,.18);animation:waveX 5s ease-in-out infinite alternate}
#prep-count .shipi{font-size:36px;color:var(--sky);flex:0 0 auto;animation:bobY 3s ease-in-out infinite}
#prep-count small{display:block;font-size:11.5px;color:var(--sky);font-weight:800;letter-spacing:.12em}
#prep-count .ct{font:600 30px/1.15 var(--dis);letter-spacing:.02em;white-space:nowrap}
#prep-count .ct em{font:900 14px 'Noto Sans TC',sans-serif;font-style:normal;margin:0 7px 0 3px;color:var(--sky)}
#prep-count .sub{font-size:12px;opacity:.85;margin-top:3px}
@keyframes bobY{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.flip-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flip{position:relative;height:122px;border:0;padding:0;background:none;perspective:800px;cursor:pointer;font-family:inherit;text-align:left}
.flip .fc{position:absolute;inset:0;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;
  justify-content:center;padding:12px 14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,.7,.25,1)}
.flip .back{transform:rotateY(180deg);background:var(--navy);color:var(--paper);font-size:12.5px;line-height:1.6;border-color:var(--navy)}
.flip.on .front{transform:rotateY(-180deg)}.flip.on .back{transform:rotateY(0)}
.flip .front .ic{font-size:22px;color:var(--coral)}
.flip .front small{font-size:11.5px;color:var(--ink3);margin-top:7px}
.flip .front b{font-size:16px;color:var(--navy);line-height:1.35}
.flip .turn{position:absolute;right:10px;bottom:8px;font-size:13px;color:var(--ink3);opacity:.6;font-style:normal}
.flip .back small{color:var(--sky);font-weight:800;margin-bottom:4px;font-size:11px;letter-spacing:.06em}
.who-g{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.who-g::-webkit-scrollbar{display:none}
.who{flex:0 0 auto;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  font-family:inherit;position:relative}
.who>svg{width:54px;height:54px;transform:rotate(-90deg)}
.who .av .ic{font-size:20px}
.who .tr{fill:var(--paper);stroke:var(--line);stroke-width:3.5}
.who .pg{fill:none;stroke:var(--sky);stroke-width:3.5;stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.3,.7,.3,1)}
.who.full .pg{stroke:#5FB89A}
.who .av{position:absolute;top:0;left:0;width:54px;height:54px;display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--navy)}
.who.on .tr{fill:var(--navy)}.who.on .av{color:var(--paper)}
.who small{font-size:11px;color:var(--ink3);font-weight:700}
.who.on small{color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line2);background:var(--paper);border-radius:14px;padding:12px 12px 12px 46px;
  min-height:64px;cursor:pointer;font-family:inherit;transition:background .25s,border-color .25s}
.tile .ck{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);
  display:grid;place-items:center;color:transparent;font-size:14px;transition:.2s}
.tile b{display:block;font-size:14px;color:var(--navy);transition:color .2s}
.tile small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.tile.on{background:#EAF6F0;border-color:#5FB89A}
.tile.on .ck{background:#5FB89A;border-color:#5FB89A;color:#fff}
.tile.on b{text-decoration:line-through;color:var(--ink3)}
.todos{padding:4px 0}
.todo{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .tk{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);background:var(--paper);display:grid;
  place-items:center;color:transparent;cursor:pointer;font-size:14px;transition:.2s;padding:0}
.todo.done .tk{background:var(--navy);border-color:var(--navy);color:#fff}
.todo .tt{display:block;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.5;transition:color .2s}
.todo.done .tt{color:var(--ink3);text-decoration:line-through}
.todo a{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;margin:4px 12px 0 0;text-decoration:none;word-break:break-all}
/* 航線圖 */
.mapcard{padding:0;overflow:hidden}
#route-svg{display:block;width:100%;height:auto;background:linear-gradient(#D7EEF8,#BFE2F2)}
#route-svg .land{fill:#F6EBD3;stroke:#D9BE86;stroke-width:.9}
#route-svg .land.tw{fill:#EFE3C6}
#route-svg .lbl{font:700 7.5px 'Noto Sans TC',sans-serif;fill:#6B5A3A;letter-spacing:.5px}
#route-svg .sea{font:600 8px 'Noto Sans TC',sans-serif;fill:#5E93AE;letter-spacing:3px;opacity:.75}
#route-svg .rt-halo{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;opacity:.7}
#route-svg .rt{fill:none;stroke:var(--coral);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:4.5 4;animation:dashMove 1.4s linear infinite}
#route-svg .pin{cursor:pointer}
#route-svg .pin circle.dot{fill:var(--navy);stroke:#fff;stroke-width:1.6;transition:.2s}
#route-svg .pin.on circle.dot{fill:var(--coral)}
#route-svg .pin .hit{fill:transparent}
#route-svg .pin text{font:800 7.5px 'Noto Sans TC',sans-serif;fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:2.6px;stroke-linejoin:round}
#route-svg .pin text.d{font:600 7px var(--dis);fill:var(--coral-d)}
#route-svg .pulse{fill:none;stroke:var(--coral);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pinPulse 1.8s ease-out infinite}
#route-svg .wv{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:.8;stroke-linecap:round}
#route-svg .cmp text{font:700 7px var(--dis);fill:var(--navy)}
#route-info{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;min-height:62px}
#route-info .dn{font:600 26px/1 var(--dis);color:var(--coral);flex:0 0 auto}
#route-info .tx{flex:1;min-width:0;font-size:13px;color:var(--ink2);line-height:1.5}
#route-info .tx b{display:block;font-size:15px;color:var(--navy)}
#route-info .btn{flex:0 0 auto;display:inline-flex;gap:5px;align-items:center;font-family:inherit}
@keyframes dashMove{to{stroke-dashoffset:-8.5}}
@keyframes pinPulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
/* 背景音樂按鈕 */
#music{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:90;width:42px;height:42px;border-radius:50%;
  border:0;background:var(--navy);color:var(--paper);display:grid;place-items:center;cursor:pointer;font-size:19px;opacity:.94;
  box-shadow:0 6px 16px rgba(22,58,80,.3);transition:background .25s}
#music::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--coral);opacity:0;animation:ringPing 2.2s 3s 3 ease-out}
#music .eq{display:none;position:absolute;inset:0;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:11px}
#music .eq i{width:4px;height:8px;border-radius:2px;background:#fff;animation:eqb .9s ease-in-out infinite}
#music .eq i:nth-child(2){animation-delay:.25s}#music .eq i:nth-child(3){animation-delay:.5s}
#music.on{background:var(--coral)}
#music.on .ic{display:none}#music.on .eq{display:flex}#music.on::after{display:none}
#music .mtip{position:absolute;left:50px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--paper);color:var(--navy);
  border:1px solid var(--line);font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;box-shadow:0 3px 10px rgba(22,58,80,.15);
  pointer-events:none;animation:tipShow 5s 2.6s both}
#music.on .mtip,#music.used .mtip{display:none}
@keyframes ringPing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes eqb{0%,100%{height:6px}50%{height:20px}}
@keyframes tipShow{0%{opacity:0;transform:translate(-6px,-50%)}10%,85%{opacity:1;transform:translate(0,-50%)}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
/* 編輯／刪除／排序 */
.fl2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fl textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);
  font:15px/1.5 inherit;font-family:inherit;resize:vertical}
.fl input[type=time],.fl input[type=date]{min-height:44px}
.fm-del{width:100%;margin-top:8px;border:1.5px solid var(--coral);background:transparent;color:var(--coral-d);border-radius:12px;
  padding:11px;font:800 14px inherit;font-family:inherit;display:flex;gap:6px;justify-content:center;align-items:center;cursor:pointer}
.fm-del.armed{background:var(--coral);color:#fff}
.btn.danger{color:var(--coral-d);border-color:var(--coral)}
.btn.danger.armed{background:var(--coral);color:#fff}
.dh-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dh-acts .btn{display:inline-flex;gap:5px;align-items:center;font-family:inherit}
.dh-acts .btn.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.tl-card{position:relative;cursor:pointer}
.tl-edit{position:absolute;top:10px;right:10px;font-size:13px;color:var(--ink3);opacity:.45}
.tl-card:hover .tl-edit{opacity:1}
.sort-tip{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--navy);background:var(--sky-l);
  border:1px dashed var(--sky);border-radius:10px;padding:8px 12px;margin:10px 0 2px}
.tl.sorting .tl-card{cursor:default}
.tl.sorting .tl-card a{pointer-events:none}
.tl.sorting .tl-edit{display:none}
.grip{display:grid;place-items:center;width:30px;height:38px;margin:0 auto 4px;border-radius:9px;background:var(--sky-l);
  color:var(--navy);font-size:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.tl-item.dragging{position:relative;z-index:20;transition:none}
.tl-item.dragging .tl-card{box-shadow:0 14px 30px rgba(22,58,80,.25);transform:scale(1.02);background:#fff}
.tl-item.dragging .grip{cursor:grabbing;background:var(--navy);color:var(--paper)}
.exp-item{cursor:pointer}
.exp-item h5 .ed{font-size:12px;color:var(--ink3);opacity:.5;margin-left:6px;vertical-align:1px}
.sk-edit{display:flex;gap:8px;width:100%;justify-content:flex-end;margin-top:4px}
.sk-edit .btn{display:inline-flex;gap:5px;align-items:center;font-family:inherit}
/* 新增表單 */
#fm .bd{padding-top:6px}
#fm h4{margin:2px 0 14px;font-size:17px;font-weight:900;color:var(--navy);display:flex;gap:7px;align-items:center}
#fm h4 .ic{color:var(--coral)}
.fl{margin-bottom:13px}
.fl>label{display:flex;gap:6px;align-items:baseline;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;letter-spacing:.05em}
.fl>label em{color:var(--coral);font-style:normal}
.fl>label small{font-weight:500;color:var(--ink3);letter-spacing:0}
.fl input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);
  font:16px/1.3 inherit;font-family:inherit;-webkit-appearance:none;appearance:none}
.fl input:focus{outline:2px solid var(--sky);outline-offset:0;border-color:var(--sky)}
.fl input.bad{border-color:var(--coral);background:#FFF6F3}
.amt{display:flex;gap:8px}.amt input{flex:1;min-width:0;font-family:var(--dis);font-size:20px;letter-spacing:.02em}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--paper);padding:0 15px;font:800 15px inherit;font-family:inherit;color:var(--ink3);cursor:pointer}
.seg button.on{background:var(--navy);color:var(--paper)}
.hint{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.5}
.hint b{color:var(--navy)}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{border:1.5px solid var(--line2);background:var(--paper);color:var(--ink2);border-radius:99px;
  padding:7px 14px;font:700 13.5px inherit;font-family:inherit;cursor:pointer;transition:.12s}
.pick button.on{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.pick.bad button{border-color:var(--coral)}
.fm-go{width:100%;margin-top:4px;border:0;border-radius:12px;padding:14px;background:var(--coral);color:#fff;
  font:800 15.5px inherit;font-family:inherit;display:flex;gap:7px;justify-content:center;align-items:center;cursor:pointer}
.fm-go[disabled]{opacity:.6;cursor:wait}
.fm-err{color:var(--coral-d);font-size:13px;font-weight:700;min-height:19px;margin-top:8px;text-align:center}
.fm-foot{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:2px}
#fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:90;border:0;border-radius:99px;
  background:var(--coral);color:#fff;padding:13px 19px 13px 15px;font:800 14.5px inherit;font-family:inherit;
  display:flex;gap:6px;align-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(227,94,69,.35),0 2px 6px rgba(22,58,80,.2);
  animation:fabIn .4s cubic-bezier(.3,1.4,.5,1) both}
#fab .ic{font-size:19px}
#fab.hide{display:none}
@keyframes fabIn{from{transform:scale(.4) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,30%{background:#FFF1C9}100%{background:transparent}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:var(--paper);padding:11px 20px;border-radius:99px;font-size:13.5px;
  font-weight:700;z-index:260;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--coral)}

/* ══════════ 動畫 ══════════ */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes charUp{from{opacity:0;transform:translateY(.4em) scale(.94)}to{opacity:1;transform:none}}
@keyframes vchar{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes stampIn{from{opacity:0;transform:scale(.55) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sealIn{0%{opacity:0;transform:scale(1.8) rotate(-10deg)}60%{opacity:1;transform:scale(.93) rotate(1.5deg)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2.6px) rotate(-.7deg)}}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(8px)}}
@keyframes waveX{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
@keyframes wake{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes sway{from{transform:rotate(-2.4deg)}to{transform:rotate(2.2deg)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(-28px,-7px)}}
@keyframes famIn{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes famBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.2}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(227,94,69,0)}50%{box-shadow:0 0 0 7px rgba(227,94,69,.22)}}

/* 封面進場 */
.display .ch{display:inline-block;animation:charUp .7s cubic-bezier(.2,.8,.2,1) both,hop 6.5s ease-in-out infinite}
.ptag{animation:fadeIn .7s .45s both}
.prule{animation:rise .6s .55s both}
.prule i{transform-origin:center;animation:fadeIn .8s .7s both}
.vtext .vc{display:inline-block;animation:vchar .5s ease-out both}
.stamp{animation:stampIn .9s .85s cubic-bezier(.2,.8,.2,1) both}
.stamp .ring{transform-box:view-box;transform-origin:50px 50px;animation:spin 48s linear infinite}
.seal{animation:sealIn .6s 1.45s cubic-bezier(.3,.7,.3,1) both}
.strip .c{animation:rise .5s both}
/* 封面插圖：雲飄、船晃、浪動、鳥飛、椰子樹擺 */
.art .a-clouds{animation:drift 13s ease-in-out infinite alternate}
.art .a-ship{transform-box:fill-box;transform-origin:50% 90%;animation:bob 4.2s ease-in-out infinite}
.art .a-waves{animation:waveX 6s ease-in-out infinite alternate}
.art .a-waves2{animation:waveX 7.5s ease-in-out infinite alternate-reverse}
.art .a-wake{animation:wake 2.8s ease-in-out infinite}
.art .a-palm{transform-box:view-box;transform-origin:326px 214px;animation:sway 4.6s ease-in-out infinite alternate}
.art .a-birds{animation:fly 16s ease-in-out infinite alternate}
.art .bird{transform-box:fill-box;transform-origin:center;animation:flap .7s ease-in-out infinite}
.art .bird.b2{animation-duration:.85s;animation-delay:.2s}
.art .bird.b3{animation-duration:.6s;animation-delay:.35s}
/* 加碼動畫：日出、光芒、小雲、海面閃光、海豚、郵輪開進來、浪花拍岸 */
.art .a-sun-in{animation:sunRise 1.8s .2s cubic-bezier(.2,.8,.2,1) both}
.art .a-rays{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.art .a-sunglow{transform-box:fill-box;transform-origin:center;animation:glowPulse 3.2s ease-in-out infinite}
.art .a-cloud2{animation:cloudPass 48s linear infinite}
.art .gl{transform-box:fill-box;transform-origin:center;opacity:0;animation:twinkle 2.8s ease-in-out infinite}
.art .g2{animation-delay:.5s}.art .g3{animation-delay:1.1s}.art .g4{animation-delay:1.7s}.art .g5{animation-delay:2.2s}.art .g6{animation-delay:.8s}
.art .a-dolphin{transform-box:fill-box;transform-origin:center;opacity:0;animation:leap 7s 3s ease-in-out infinite}
.art .a-splash{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:splash 7s 3s ease-out infinite}
.art .a-splash.s2{animation-name:splash2}
.art .a-ship-in{animation:sailIn 2.4s .1s cubic-bezier(.15,.7,.25,1) both}
.art .a-foam{animation:wash 3.8s ease-in-out infinite}
@keyframes sunRise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.18);opacity:.35}}
@keyframes cloudPass{from{transform:translateX(-50px)}to{transform:translateX(450px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.25)}60%{opacity:.2;transform:scale(.6)}}
@keyframes leap{0%,74%{opacity:0;transform:translate(-14px,6px) rotate(-45deg)}
  76%{opacity:1;transform:translate(-11px,2px) rotate(-38deg)}
  82%{transform:translate(0,-15px) rotate(0)}
  88%{opacity:1;transform:translate(11px,2px) rotate(40deg)}
  90%,100%{opacity:0;transform:translate(14px,6px) rotate(48deg)}}
@keyframes splash{0%,75%{opacity:0;transform:scale(.3)}77%{opacity:1;transform:scale(1)}83%,100%{opacity:0;transform:scale(1.5)}}
@keyframes splash2{0%,88%{opacity:0;transform:scale(.3)}90%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1.5)}}
@keyframes sailIn{from{transform:translateX(150px)}to{transform:none}}
@keyframes wash{0%,100%{transform:translateY(0);stroke-opacity:.9}50%{transform:translateY(3.5px);stroke-opacity:.35}}
/* 標題字：進場後每隔幾秒輪流跳一下 */
@keyframes hop{0%,84%,100%{transform:none}88%{transform:translateY(-10px) rotate(-4deg)}92%{transform:translateY(1px)}95%{transform:none}}
/* 全家福：點一下跳起來＋撒彩紙 */
.family img{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.family img.jump{animation:famJump .65s cubic-bezier(.3,.7,.3,1)}
@keyframes famJump{0%{transform:none}30%{transform:translateY(-18px) scale(1.03)}55%{transform:translateY(0) scale(.98,1.02)}75%{transform:translateY(-5px)}100%{transform:none}}
.cf{position:absolute;z-index:4;pointer-events:none;border-radius:2px;will-change:transform}
/* 全家福：站在海報裡的沙灘上（海報變高一點，海平線往上推，人物不會擋到郵輪） */
.poster.with-fam{height:clamp(400px,118vw,540px)}
.art .a-beach{display:none}
.poster.with-fam .art .a-beach{display:inline}
.family{position:absolute;left:0;right:0;bottom:6px;z-index:1;text-align:center;pointer-events:none}
.family img{display:block;width:min(74%,460px);height:auto;margin:0 auto;
  filter:drop-shadow(0 5px 6px rgba(60,40,10,.22));animation:famIn .8s 1.1s cubic-bezier(.2,.8,.2,1) both}
.family img.idle{animation:famBob 3.6s ease-in-out infinite}
.family .cap{display:none}
.poster.with-fam .vtext{text-shadow:0 0 6px rgba(255,255,255,.75)}
@media (min-width:600px){ .poster.with-fam .stamp{top:22px} }
@media (max-width:440px){
  .vtext{font-size:14px;letter-spacing:.2em}
  .family{bottom:22px}                        /* 手機：人物往上提一點 */
  .frame.has-family .seal{bottom:22px}
}
@media (min-width:441px){ .vtext .vbr{display:none} }
/* 內容 */
.enter{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.ticket.warn{animation:glow 1.8s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
.card,.day,.stat{transition:transform .2s,box-shadow .2s}
@media(hover:hover){
  .day:hover{transform:translateY(-2px)}
  .tl-card:hover,.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,78,106,.08)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

@media(max-width:400px){
  .strip .c{gap:6px;padding:4px 6px}
  .strip .c .ic{font-size:21px}
  .strip .c b{font-size:12.5px}
  .stat b{font-size:16px}
  .filters{grid-template-columns:1fr}
}
</style>
</head>

<script>
/* ══════════════ 設定（全部來自 config.js，Sheet 不用改） ══════════════ */
const CONF     = (typeof window!=='undefined' && window.TRIP_CONFIG) || {};
const GAS_URL  = CONF.GAS_URL || '';
const TOKEN    = CONF.TOKEN   || '';
const MEMBERS  = CONF.成員 || [];
const BAGPPL   = CONF.行李成員 || [];
const LEGS     = CONF.航程 || [];
const SHIP     = CONF.船上資訊 || {};

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const DB = {};
let GAS_ERR = null;

/* ─────────── 小工具 ─────────── */
const ic  = (n,c='') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bool = v => /^(true|yes|1|v|✓|是)$/i.test(String(v).trim());
const num = v => { const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const nt  = n => 'NT$'+Math.round(n).toLocaleString('en-US');
const WD  = ['日','一','二','三','四','五','六'];
const WDE = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const TYPE_IC = {交通:'boat',景點:'camera',餐飲:'food',美食:'food',點心:'cup',購物:'bag',住宿:'bed',其他:'note'};
const SHIP_IC = {船名:'ship',艙房:'door',甲板:'layers',船卡:'card',WiFi:'wifi',集合地點:'flag',
                 緊急電話:'phone',用餐:'food',注意事項:'alert'};
const INFO_IC = {前往國家:'flag',當地天氣:'sun',出遊天數:'cal',同行旅伴:'users'};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let QUIET=false;                                   // 打勾後的重畫不要再跑一次進場動畫
function stagger(root,sel,step=38,max=14){
  if(REDUCED||QUIET||!root) return;
  root.querySelectorAll(sel).forEach((el,i)=>{ el.style.animationDelay=Math.min(i,max)*step+'ms'; el.classList.add('rise'); });
}
function quiet(fn){ QUIET=true; try{ fn(); } finally{ QUIET=false; } }
function popEl(el){ if(!REDUCED&&el&&el.animate) el.animate(
  [{transform:'scale(.7)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'}); }
function countUp(el){
  if(REDUCED) return;
  const txt=el.textContent, m=txt.match(/^(\D*)([\d,]+)(.*)$/); if(!m) return;
  const end=+m[2].replace(/,/g,''), t0=performance.now(), D=700;
  const step=t=>{ const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3);
    el.textContent=m[1]+Math.round(end*e).toLocaleString('en-US')+m[3];
    if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
/* 彩紙：從人物頭上噴出來再飄落（只在海報裡面） */
function confetti(from,n=30,host){
  if(REDUCED||!from) return;
  const po=host||$('.poster'), pr=po.getBoundingClientRect(), fr=from.getBoundingClientRect();
  const W=pr.width, H=pr.height, x0=fr.left-pr.left+fr.width/2, y0=fr.top-pr.top+fr.height*.18;
  const cols=['#E35E45','#FFC14D','#86CBEA','#1E4E6A','#FFFDF8','#F4B8A8','#5FB89A'];
  for(let i=0;i<n;i++){
    const s=document.createElement('i'), w=4+Math.random()*5, round=Math.random()<.3;
    s.className='cf';
    s.style.cssText=`left:${x0+(Math.random()-.5)*fr.width*.7}px;top:${y0}px;width:${w}px;height:${round?w:w*1.7}px;`
      +`background:${cols[i%cols.length]};${round?'border-radius:50%;':''}`;
    po.appendChild(s);
    const dx=(Math.random()-.5)*W*.8, up=H*(.22+Math.random()*.28), r=(Math.random()-.5)*900;
    const a=s.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:`translate(${dx*.55}px,${-up}px) rotate(${r*.4}deg)`,opacity:1,offset:.32},
      {transform:`translate(${dx}px,${H*.35}px) rotate(${r}deg)`,opacity:0}],
      {duration:1500+Math.random()*1000,easing:'cubic-bezier(.25,.6,.35,1)',delay:Math.random()*120});
    a.onfinish=()=>s.remove();
  }
}
const typeTag = (t,soft) => `<span class="tag${soft?' soft':''}">${ic(TYPE_IC[t]||'note')}${esc(t)}</span>`;

function driveImg(u,w){
  const s=String(u||'').trim();
  const m=s.match(/\/d\/([-\w]{20,})|[?&]id=([-\w]{20,})/);
  return m?`https://drive.google.com/thumbnail?id=${m[1]||m[2]}&sz=w${w||400}`:s;
}
function mapLink(q,url){
  if(url && /^https?:/.test(url)) return url;
  return q ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q) : '';
}
function toast(msg,bad){
  const t=$('#toast'); t.textContent=msg; t.className='on'+(bad?' bad':'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3000);
}
function openLB(img){
  const lb=$('#lb');
  lb.querySelector('img').src=img.dataset.full||img.src;
  lb.querySelector('.cap').textContent=img.dataset.cap||'';
  lb.classList.add('on');
}
$('#lb').onclick=()=>$('#lb').classList.remove('on');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#lb').classList.remove('on'); });

function splitTag(s){
  const m=String(s||'').match(/^\s*[<〈＜]([^>〉＞]{1,10})[>〉＞]\s*([\s\S]*)$/);
  return m ? {tag:m[1].trim(), rest:m[2].trim()} : {tag:'', rest:String(s||'').trim()};
}
function dur(a,b){
  const p=s=>{const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null;};
  const x=p(a),y=p(b); if(x===null||y===null) return '';
  let d=y-x; if(d<0)d+=1440;
  return d? `${Math.floor(d/60)}:${String(d%60).padStart(2,'0')}`:'';
}
function ymd(d){ return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function parseDT(dateStr,timeStr){
  const d=String(dateStr||'').replace(/[.\-]/g,'/').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  const t=String(timeStr||'').match(/(\d{1,2}):(\d{2})/);
  if(!d) return null;
  return new Date(+d[1],+d[2]-1,+d[3], t?+t[1]:0, t?+t[2]:0, 0);
}
const md  = d => d ? (d.getMonth()+1)+'/'+d.getDate() : '';
const mdz = d => d ? String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0') : '';

/* ─────────── 強調色（可選）：config.js 加「強調色: '#xxxxxx'」就會換掉珊瑚紅 ─────────── */
function hex2hsl(x){
  let h=String(x).trim().replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-f]{6}$/i.test(h)) return null;
  const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let hh=0,ss=0; const ll=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn; ss=ll>.5?d/(2-mx-mn):d/(mx+mn);
    hh=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); hh/=6;}
  return [hh*360, ss*100, ll*100];
}
function hsl2hex(h,s,l){
  s=Math.max(0,Math.min(100,s))/100; l=Math.max(0,Math.min(100,l))/100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>{const v=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
              return Math.round(255*v).toString(16).padStart(2,'0');};
  return '#'+f(0)+f(8)+f(4);
}
function applyAccent(){
  const hsl=hex2hsl(CONF.強調色||''); if(!hsl) return;
  const [h,s,l]=hsl, R=document.documentElement.style;
  R.setProperty('--coral',CONF.強調色.trim());
  R.setProperty('--coral-d',hsl2hex(h,s,Math.max(18,l*.84)));
  R.setProperty('--coral-l',hsl2hex(h,Math.min(80,s),93));
}

/* ─────────── 通行碼 ─────────── */
const AUTH_KEY='cruise-oka-auth';
let AUTH='';
try{
  if(location.search.indexOf('logout')>=0) localStorage.removeItem(AUTH_KEY);
  AUTH=localStorage.getItem(AUTH_KEY)||'';
}catch(e){}
async function sha256hex(t){
  try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
       return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return t; }
}
function showLock(msg){ $('#lock').classList.add('on'); $('#lock-msg').textContent=msg||'';
  setTimeout(()=>$('#lock-in').focus(),100); }
async function tryUnlock(){
  const v=$('#lock-in').value.trim(); if(!v) return;
  const b=$('#lock-go'); b.disabled=true; b.textContent='驗證中…'; $('#lock-msg').textContent='';
  try{
    AUTH=await sha256hex(v);
    await callGAS('ping',{});
    try{ localStorage.setItem(AUTH_KEY,AUTH); }catch(e){}
    location.href=location.pathname;
  }catch(err){
    AUTH='';
    $('#lock-msg').textContent = err.message==='AUTH_LOCKED' ? '錯太多次了，請 10 分鐘後再試'
      : /AUTH/.test(err.message) ? '通行碼不對' : err.message;
    b.disabled=false; b.textContent='進入'; $('#lock-in').select();
  }
}
$('#lock-go').onclick=tryUnlock;
$('#lock-in').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });

/* ─────────── 連後端 (JSONP) ─────────── */
function normGas(u){
  u=String(u||'').trim().replace(/^["'\s]+|["'\s]+$/g,'');
  if(!u) return '';
  if(/^AKfyc[\w-]+$/.test(u)) return 'https://script.google.com/macros/s/'+u+'/exec';
  if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+$/.test(u)) return u+'/exec';
  return u.replace(/\/+$/,'');
}
const GAS=normGas(GAS_URL);
const GAS_OK_RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
const pingUrl=()=>GAS+'?token='+encodeURIComponent(TOKEN)+'&action=ping';
let jseq=0;
/* 先用 fetch（不帶 Google 登入 cookie）—— 瀏覽器同時登入多個 Google 帳號時，
   Apps Script 會把帶 cookie 的請求導去 /u/1/ 而「找不到網頁」。fetch 不帶 cookie 就不會。
   fetch 失敗（舊瀏覽器、網路擋）才退回 JSONP。 */
function gasQuery(action,payload){
  return 'token='+encodeURIComponent(TOKEN)
    +'&auth='+encodeURIComponent(AUTH||'')
    +'&action='+encodeURIComponent(action)
    +'&payload='+encodeURIComponent(JSON.stringify(payload||{}));
}
let TRANSPORT='';   // '' 還沒試過 / 'fetch' / 'jsonp'
async function callGAS(action,payload){
  if(!GAS) throw new Error('NOCONFIG');
  if(TRANSPORT==='jsonp') return callGASjsonp(action,payload);
  let r;
  try{
    const ac=new AbortController(), t=setTimeout(()=>ac.abort(),25000);
    const res=await fetch(GAS+'?'+gasQuery(action,payload),{credentials:'omit',signal:ac.signal});
    clearTimeout(t);
    r=JSON.parse(await res.text());
    TRANSPORT='fetch';
  }catch(e){
    // fetch 已經證明可用 → 這次就是網路問題，不要換 JSONP 重送（避免寫入送兩次）
    if(TRANSPORT==='fetch') throw new Error(e&&e.name==='AbortError'?'連線逾時':'無法連線到 Apps Script');
    TRANSPORT='jsonp';
    return callGASjsonp(action,payload);
  }
  if(r&&r.ok) return r.data;
  throw new Error((r&&r.error)||'未知錯誤');
}
function callGASjsonp(action,payload){
  return new Promise((resolve,reject)=>{
    if(!GAS) return reject(new Error('NOCONFIG'));
    const cb='__gas'+(++jseq), s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();reject(new Error('連線逾時'));},25000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=r=>{cleanup(); r&&r.ok?resolve(r.data):reject(new Error((r&&r.error)||'未知錯誤'));};
    s.onerror=()=>{cleanup();reject(new Error('無法連線到 Apps Script'));};
    s.src=GAS+'?callback='+cb+'&'+gasQuery(action,payload);
    document.body.appendChild(s);
  });
}
function gasHelp(){
  if(GAS_ERR==='NOCONFIG'||!GAS) return `<div class="err">
    <b>還沒設定 Apps Script 網址</b>
    打開 <code>config.js</code>，把部署後拿到的網址填進 <code>GAS_URL</code>：<br>
    <code>https://script.google.com/macros/s/<b>AKfycb</b>……/exec</code></div>`;
  if(!GAS_OK_RE.test(GAS)) return `<div class="err">
    <b>GAS_URL 填錯了</b>目前是：<code>${esc(GAS_URL)}</code><br>
    正確長相 <code>https://script.google.com/macros/s/AKfycb……/exec</code>
    （結尾要 <b>/exec</b>，不是 <code>/dev</code>；<code>1BzT…</code> 開頭的是指令碼 ID，不能用）</div>`;
  return `<div class="err"><b>連不上 Apps Script</b>
    <a href="${esc(pingUrl())}" target="_blank" rel="noopener">點這裡測試你的網址</a>
    （看到 <code>{"ok":true…}</code> 代表後端正常）<br>
    ・要求登入 → 部署時「誰可以存取」沒選<b>任何人</b><br>
    ・改過 Code.gs → 要重新部署，版本選「<b>新版本</b>」<br>
    ・測試頁顯示「找不到網頁」→ 多半是同時登入多個 Google 帳號，改用無痕視窗開<br>
    <span class="muted">（${esc(GAS_ERR||'')}）</span></div>`;
}

  const t=ymd(new Date());

  curDay=idx>=0?idx:0;
  renderDayTabs();
  $('#days').onclick=e=>{

    curDay=+el.dataset.d;
    $$('#days .day').forEach(x=>x.classList.toggle('on',x===el));
    renderTL();

function renderDayTabs(){
  const days=DB.all.行程||[];
  $('#days').innerHTML=days.map((d,i)=>{
    const leg=LEGS[i]||{}, dt=parseDT(leg.日期,'00:00');
    return `<div class="day${i===curDay?' on':''}" data-d="${i}">
      <b>${esc(d.key)}</b><span>${dt?md(dt)+' 週'+WD[dt.getDay()]:esc(d.日期||'')}</span>
      <span class="pt">${esc(String(leg.港口||d.地點||'').split(/\s/)[0])}</span></div>`;

      <div style="min-width:0;flex:1">

      <p class="muted">${esc(d.key)} 還沒排行程<br>按上面「加行程」，或到試算表「${esc(d.sheet)}」分頁填</p></div>`;

    +`<div class="tl${SORTING?' sorting':''}">`+rows.map(r=>{

    const d2=r['間隔']||dur(r['抵達時間'],r['離開時間']);

    const f=[];
    if(r['交通方式']) f.push(`<span>${ic('boat')}${esc(r['交通方式'])}${r['交通時間']&&r['交通時間']!=='0:00'?' · '+esc(r['交通時間']):''}</span>`);
    if(num(r['交通花費'])) f.push(`<span>${ic('yen')}${esc(r['交通花費'])}</span>`);
    if(ml) f.push(`<a href="${esc(ml)}" target="_blank" rel="noopener">${ic('pin')}${esc(r['地點']||'地圖')}</a>`);
    if(r['備註']) f.push(`<span>${ic('note')}${esc(r['備註'])}</span>`);
    return `<div class="tl-item" data-row="${r._row}">
      <div class="tl-time">${SORTING?`<span class="grip" aria-label="拖拉">${ic('grip')}</span>`:''}<b>${esc(r['抵達時間']||'')}</b><span>${esc(d2||'')}</span></div>
      <div class="tl-body"><div class="tl-dot"></div><div class="tl-card">
        <span class="tl-edit" aria-hidden="true">${ic('pen')}</span>
        ${(type||sp.tag||r['區域'])?`<div class="tl-tags">

          ${r['區域']?`<span class="tag soft">${ic('pin')}${esc(r['區域'])}</span>`:''}

        ${r['說明']?`<p class="desc">${esc(r['說明'])}</p>`:''}
        ${f.length?`<div class="tl-foot">${f.join('')}</div>`:''}

/* ── 行程拖拉排序（手機、電腦都能用；按住把手拖） ── */
let DRAG=null;
$('#tl-box').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip'); if(!g) return;
  e.preventDefault();
  const it=g.closest('.tl-item');
  try{ g.setPointerCapture(e.pointerId); }catch(_){}
  const before=$$('#tl-box .tl-item').map(x=>x.dataset.row).join(',');
  const top0=it.getBoundingClientRect().top+scrollY;
  DRAG={it,g,off:e.clientY+scrollY-top0,before,id:e.pointerId};
  it.classList.add('dragging');
});
function dragMove(e){
  if(!DRAG||e.pointerId!==DRAG.id) return;
  e.preventDefault();
  const y=e.clientY, it=DRAG.it, list=it.parentElement;
  const sibs=[...list.children].filter(x=>x!==it);
  const next=sibs.find(x=>{ const r=x.getBoundingClientRect(); return y<r.top+r.height/2; });
  if(next!==it.nextElementSibling||(!next&&list.lastElementChild!==it)) list.insertBefore(it,next||null);
  it.style.transform='none';
  const nowTop=it.getBoundingClientRect().top+scrollY;          // 移位後（沒有位移時）的位置
  it.style.transform=`translateY(${y+scrollY-DRAG.off-nowTop}px)`; // 讓卡片黏在手指下
  if(y<70) scrollBy(0,-12); else if(y>innerHeight-70) scrollBy(0,12);
}
async function dragEnd(e){
  if(!DRAG||e.pointerId!==DRAG.id) return;
  const {it,before}=DRAG;
  it.style.transform=''; it.classList.remove('dragging');
  setTimeout(()=>{ DRAG=null; },0);
  const items=$$('#tl-box .tl-item');
  if(items.map(x=>x.dataset.row).join(',')===before) return;
  popEl(it);
  const d=(DB.all.行程||[])[curDay];
  const byRow=Object.fromEntries((d.rows||[]).map(r=>[String(r._row),r]));
  try{
    await callGAS('reorder',{sheet:d.sheet,items:items.map(x=>({row:+x.dataset.row,expect:{行程:byRow[x.dataset.row]['行程']}}))});
    toast('新順序已存到試算表');
    DB.all=await callGAS('getAll',{});
    renderTL();
  }catch(err){ toast(errMsg(err),true); renderTL(); }
}
window.addEventListener('pointermove',dragMove,{passive:false});
window.addEventListener('pointerup',dragEnd);
window.addEventListener('pointercancel',dragEnd);

/* ══════════════ 2. 分帳 ══════════════ */
function rate(){ return parseFloat(CONF.匯率||0.203)||0.203; }
function twd(r){ return num(r['台幣']) || num(r['日幣'])*rate(); }
function sharers(r){ return MEMBERS.filter(m=>bool(r[m.名稱])); }

function loadExpense(){
  $('#ex-rate').textContent=`1${CONF.幣別符號||'¥'} ≈ ${rate()} 台幣`;
  DB.exp=(DB.all.花費||[]).filter(r=>r['項目']);
  renderExp();
}
function renderExp(){
  const rows=DB.exp||[];
  const open=rows.filter(r=>!bool(r['已結算']));
  const doneCount=rows.length-open.length;
  const total=rows.reduce((s,r)=>s+twd(r),0);
  const heads=MEMBERS.reduce((s,m)=>s+(m.權重||1),0)||1;
  const openSum=open.reduce((s,r)=>s+twd(r),0);
  $('#ex-stats').innerHTML=`
    <div class="stat"><b>${nt(total)}</b><span>總花費（${rows.length} 筆）</span></div>
    <div class="stat"><b>${nt(total/heads)}</b><span>平均每人</span></div>
    <div class="stat"><b>${nt(openSum)}</b><span>待結算（${open.length} 筆）</span></div>`;
  $('#ex-note').textContent=doneCount?`已排除 ${doneCount} 筆結清的`:'正數 = 該收回';

  const bal={}; MEMBERS.forEach(m=>bal[m.名稱]=0);
  open.forEach(r=>{
    const amt=twd(r); if(!amt) return;
    const list=sharers(r); if(!list.length) return;
    const w=list.reduce((s,m)=>s+(m.權重||1),0);
    const p=(r['付款人']||'').trim();
    if(p in bal) bal[p]+=amt;
    list.forEach(m=>{ bal[m.名稱]-=amt*(m.權重||1)/w; });
  });
  $('#ex-bal').innerHTML=MEMBERS.map(m=>`
    <div class="bal"><span class="who">${ic((m.權重||1)>1?'users':'user')}${esc(m.名稱)}${(m.權重||1)>1?` <em>（${m.權重} 人）</em>`:''}</span>
      <span class="amt ${bal[m.名稱]>=0?'pos':'neg'}">${bal[m.名稱]>=0?'+':'−'}${nt(Math.abs(bal[m.名稱]))}</span></div>`).join('');

  const cred=[],debt=[];
  MEMBERS.forEach(m=>{ const v=Math.round(bal[m.名稱]);
    if(v>0)cred.push({m:m.名稱,v}); else if(v<0)debt.push({m:m.名稱,v:-v}); });
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  const tx=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const v=Math.min(debt[i].v,cred[j].v);
    if(v>0) tx.push(`<div class="row">${ic('user')}<b>${esc(debt[i].m)}</b>${ic('arrow')}<b>${esc(cred[j].m)}</b><span class="amt">${nt(v)}</span></div>`);
    debt[i].v-=v; cred[j].v-=v;
    if(debt[i].v<1)i++; if(cred[j].v<1)j++;
  }
  $('#ex-settle').innerHTML=tx.length?tx.join('')
    :`<div class="row">${ic('check')}${rows.length&&!open.length?'全部都結清了，帳目歸零':'目前大家都是平的'}</div>`;

  $('#ex-bulk').innerHTML=
    (open.length?`<button class="btn sm" data-bulk="TRUE">全部標記結清（${open.length} 筆）</button>`:'')+
    (doneCount?`<button class="btn sm ghost" data-bulk="FALSE">全部取消結清（${doneCount} 筆）</button>`:'');

  stagger($('#ex-bal'),'.bal'); stagger($('#ex-settle'),'.row');
  const showDone=$('#ex-showdone').checked;
  const list=showDone?rows:open;
  $('#ex-count').textContent=doneCount?`未結清 ${open.length}・已結清 ${doneCount}`:`共 ${rows.length} 筆`;
  $('#ex-list').innerHTML=list.length?[...list].reverse().map(r=>{
    const done=bool(r['已結算']), sp=sharers(r);
    const w=sp.reduce((s,m)=>s+(m.權重||1),0);
    return `<div class="exp-item${done?' done':''}" data-r="${r._row}">
      <div><h5>${esc(r['項目'])}<span class="ed">${ic('pen')}</span></h5>
        <div class="sub">${esc(r['日期']||'')} · ${esc(r['付款人']||'?')} 先付 · 分攤 ${w} 人
          ${sp.length?'（'+sp.map(m=>esc(m.名稱)).join('、')+'）':''}</div></div>
      <div class="money">${nt(twd(r))}
        ${num(r['日幣'])?`<small>${CONF.幣別符號||'¥'}${num(r['日幣']).toLocaleString()}</small>`:''}
        <button class="btn sm ghost" style="margin-top:6px;font-family:inherit"
          data-row="${r._row}" data-v="${done?'FALSE':'TRUE'}" data-exp="${done?'TRUE':'FALSE'}">
          ${done?'已結算':'標記結清'}</button></div></div>`;
  }).join('') : `<div class="bal muted">${rows.length?'沒有未結清的花費':'還沒有花費紀錄'}</div>`;
}

/* ══════════════ 3. 郵輪 ══════════════ */
function aboardState(){
  const now=new Date(), today=ymd(now);
  const leg=LEGS.find(l=>String(l.日期).replace(/-/g,'/')===today);
  if(!leg) return null;
  if(!leg.回船) return {leg,text:'',none:true};
  const t=parseDT(leg.日期,leg.回船);
  if(!t) return {leg,text:'',none:true};
  const diff=t-now;
  if(diff<=0) return {leg,past:true,text:`${leg.港口} 回船時間已過`};
  const h=Math.floor(diff/36e5), m=Math.floor(diff%36e5/6e4);
  return {leg,diff,h,m,warn:diff<36e5,text:`回船倒數 ${h}:${String(m).padStart(2,'0')}`};
}
function renderShip(){
  if(!$('#route-svg').childElementCount) renderMap();      // 地圖只畫一次（每 30 秒更新倒數時不重畫，船才不會跳回起點）
  const ab=aboardState(), box=$('#aboard-box');
  const stub=(leg,label)=>{
    const dt=leg?parseDT(leg.日期,'00:00'):null;
    return `<div class="stub">${ic('anchor')}<div class="dno">${esc(leg?leg.key:'')}</div>
      <small>${dt?md(dt)+' 週'+WD[dt.getDay()]:''}<br>${esc(label||'')}</small></div>`;
  };
  if(!ab){

    const dd=start?Math.round((start-new Date(new Date().toDateString()))/864e5):null;

        <div class="sm">${dd<0?'旅程已結束':esc(CONF.副標題||'')}</div></div>

  }else if(ab.none){
    box.innerHTML=`<div class="ticket"><div class="main">

        <div class="big zh">${esc(ab.leg.港口)}</div>

      ${stub(ab.leg,ab.leg.抵達?'抵 '+ab.leg.抵達:'')}</div>`;
  }else{
    box.innerHTML=`<div class="ticket${ab.warn||ab.past?' warn':''}"><div class="main">

      ${stub(ab.leg,'回船 '+ab.leg.回船)}</div>`;
  }
  const today=ymd(new Date());
  $('#ports').innerHTML=LEGS.map((l,i)=>{

      <div class="nd">${ic(first||last?'anchor':'island')}</div>

async function toggleShop(rowNum){
  const r=(DB.shop||[]).find(x=>x._row===rowNum); if(!r) return;
  const was=bool(r['已購買']), v=was?'FALSE':'TRUE';
  const cb=$(`#sh-box .cb[data-row="${rowNum}"]`);
  if(cb){ cb.classList.toggle('on',!was); popEl(cb); }

function renderSkSay(){

function syncSkBought(on){

function closeSk(){
  $('#sk').classList.remove('on'); $('#sk').setAttribute('aria-hidden','true');
  document.body.style.overflow='';

}
function sayJa(text,btn){
  if(!('speechSynthesis' in window)){ toast('這支手機不支援朗讀，直接把畫面給店員看就好',true); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=.9;
  const vs=speechSynthesis.getVoices(), v=vs.find(v=>/^ja[-_]JP/i.test(v.lang))||vs.find(v=>/^ja/i.test(v.lang));
  if(v) u.voice=v;
  btn.classList.add('on'); u.onend=u.onerror=()=>btn.classList.remove('on');
  speechSynthesis.speak(u);
}
$('#sk').onclick=e=>{
  if(e.target.closest('.bk')||e.target.closest('.x')) return closeSk();

  const q=e.target.closest('#sk-qty button'); if(q){ SK.n=Math.max(1,Math.min(20,SK.n+(+q.dataset.d))); renderSkSay(); return; }
  if(e.target.closest('#sk-speak')) return sayJa($('#sk-ja').textContent,$('#sk-speak'));
  const im=e.target.closest('#sk-pic img'); if(im) return openLB(im);
  if(e.target.closest('.bought')) return toggleShop(SK.row);
  const sk=e.target.closest('[data-sk]');
  if(sk&&sk.dataset.sk==='edit'){ const row=SK.row; closeSk(); return openForm('shop',row); }
  if(sk&&sk.dataset.sk==='del'){
    if(!sk.classList.contains('armed')){
      sk.classList.add('armed'); sk.innerHTML=ic('trash')+'再按一次確定';
      clearTimeout(sk._t); sk._t=setTimeout(()=>{ sk.classList.remove('armed'); sk.innerHTML=ic('trash')+'刪除'; },3500);
      return;
    }
    const r=(DB.shop||[]).find(x=>x._row===SK.row); if(!r) return;
    sk.disabled=true; sk.textContent='刪除中…';

function smoothPath(pts,closed){                                           // Catmull-Rom → 貝茲，讓海岸線圓滑
  const P=pts.map(PJ), n=P.length, g=i=>P[(i+n)%n];
  let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for(let i=0;i<(closed?n:n-1);i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d+(closed?'Z':'');
}

/* ══════════════ 背景音樂：原創島嶼小曲，瀏覽器即時合成（沒有版權問題）
   烏克麗麗刷弦＋鋼鼓旋律＋沙鈴＋海浪聲。想換成自己的音樂檔：config.js 加  音樂: 'music.mp3'
   ══════════════════════════════════════════════════════════════════════════ */
const MUSIC=(()=>{
  let ctx=null, master=null, timer=null, step=0, nextT=0, on=false, el=null, ocean=false, nb=null;
  const BPM=96, EIGHTH=60/BPM/2;
  const M={C2:36,D2:38,E2:40,F2:41,G2:43,A2:45,G3:55,A3:57,B3:59,C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79,A5:81};
  const hz=n=>440*Math.pow(2,(M[n]-69)/12);
  const CH=[{b:'C2',c:['C4','E4','G4','C5']},{b:'A2',c:['A3','C4','E4','A4']},{b:'F2',c:['A3','C4','F4','A4']},{b:'G2',c:['G3','B3','D4','G4']}];
  const MEL=['E5',0,'G5',0,'A5','G5','E5',0,  'C5',0,'E5',0,'D5','C5','A4',0,  'A4',0,'C5',0,'D5',0,'C5','A4',  'G4',0,'A4',0,'B4',0,'D5',0,
             'G5',0,'E5','G5','A5',0,'G5',0,  'E5',0,'C5',0,'D5','E5',0,0,    'A5','G5','F5',0,'E5',0,'D5',0,  'D5',0,'E5',0,'C5',0,0,0];
  const STRUM=[1,0,1,1,0,1,1,1];                    // 下 - 下上 - 上下上
  const env=(g,t,a,p,d)=>{ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); };
  function uke(f,t,v){ const o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value=f; lp.type='lowpass'; lp.frequency.setValueAtTime(3400,t); lp.frequency.exponentialRampToValueAtTime(800,t+.3);
    o.connect(lp).connect(g).connect(master); env(g,t,.004,v,.42); o.start(t); o.stop(t+.5); }
  function steel(f,t,v){ [[1,1],[2.01,.35],[3,.1]].forEach(([m,k])=>{ const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=f*m; o.connect(g).connect(master); env(g,t,.006,v*k,.75); o.start(t); o.stop(t+.85); }); }
  function bass(f,t,v){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='triangle'; o.frequency.value=f;
    o.connect(g).connect(master); env(g,t,.012,v,.5); o.start(t); o.stop(t+.6); }
  function noiseBuf(){ if(nb) return nb; nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return nb; }
  function shaker(t,v){ const s=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=noiseBuf();
    hp.type='highpass'; hp.frequency.value=6500; s.connect(hp).connect(g).connect(master); env(g,t,.003,v,.05); s.start(t,Math.random()*1.5); s.stop(t+.08); }
  function startOcean(){ const s=ctx.createBufferSource(), lp=ctx.createBiquadFilter(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
    s.buffer=noiseBuf(); s.loop=true; lp.type='lowpass'; lp.frequency.value=380; g.gain.value=.05; lfo.frequency.value=.085; lg.gain.value=.04;
    lfo.connect(lg).connect(g.gain); s.connect(lp).connect(g).connect(master); s.start(); lfo.start(); ocean=true; }
  function tick(){
    while(nextT<ctx.currentTime+.15){
      const i=step%8, ch=CH[Math.floor(step/8)%4];
      if(STRUM[i]){ const up=i%2===1, ns=up?ch.c.slice().reverse():ch.c;
        ns.forEach((n,k)=>uke(hz(n),nextT+k*.013,(i===0?.07:.045)*(up?.75:1))); }
      if(i===0||i===3||i===4) bass(hz(ch.b),nextT,i===0?.2:.12);
      if(step>=32){ const m=MEL[(step-32)%64]; if(m) steel(hz(m),nextT,.085); }   // 前 4 小節前奏，之後鋼鼓旋律進來
      shaker(nextT,i%2?.03:.018);
      nextT+=EIGHTH*(i%2===0?1.1:.9);                                             // 一點點搖擺
      step++;
    }
  }
  async function play(){
    if(CONF.音樂){ if(!el){ el=new Audio(CONF.音樂); el.loop=true; el.volume=.6; } await el.play(); on=true; return; }
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(_){}    // iPhone 靜音模式也聽得到
    if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) throw new Error('這個瀏覽器不支援');
      ctx=new AC(); const comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.gain.value=.0001;
      master.connect(comp).connect(ctx.destination); }
    await ctx.resume();
    const t=ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(.0001,t); master.gain.exponentialRampToValueAtTime(.75,t+1.4);
    if(!ocean) startOcean();
    step=0; nextT=t+.06; clearInterval(timer); timer=setInterval(tick,30); tick(); on=true;
  }
  function stop(){
    on=false;
    if(el){ el.pause(); return; }
    if(!ctx) return;
    const t=ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(Math.max(master.gain.value,.0001),t);
    master.gain.exponentialRampToValueAtTime(.0001,t+.5);
    setTimeout(()=>{ if(!on){ clearInterval(timer); ctx.suspend(); } },600);
  }
  return { async toggle(){ if(on) stop(); else await play(); return on; }, stop, play, get on(){ return on; } };
})();
$('#music').onclick=async()=>{
  const b=$('#music'); b.classList.add('used');
  try{ const isOn=await MUSIC.toggle(); b.classList.toggle('on',isOn); b.setAttribute('aria-label',isOn?'暫停背景音樂':'播放背景音樂'); popEl(b); }
  catch(e){ toast('沒辦法播放音樂：'+e.message,true); }
};
let MUSIC_WAS=false;
document.addEventListener('visibilitychange',()=>{                         // 切到別的 App 就先停，回來再繼續
  if(document.hidden){ MUSIC_WAS=MUSIC.on; if(MUSIC.on) MUSIC.stop(); }
  else if(MUSIC_WAS){ MUSIC.play().then(()=>$('#music').classList.add('on')).catch(()=>$('#music').classList.remove('on')); }
  if(document.hidden) $('#music').classList.remove('on');
});

const SHEET_OF=(kind,day)=>kind==='exp'?'花費表':kind==='shop'?'購物清單':((DB.all.行程||[])[day]||{}).sheet||`行程表_D${day+1}`;

async function deleteRow(kind,row,orig,day,btn){

    await callGAS('clear',{sheet,row,expect:{[k]:orig[k]}});

async function submitForm(){
  const err=$('#f-err'); err.textContent='';
  const val=id=>String(($(id)||{}).value||'').trim();
  const on=id=>$$(id+' button.on').map(b=>b.dataset.v);
  const bad=(el,msg)=>{ el.classList.add('bad'); err.textContent=msg; if(el.tagName==='INPUT') el.focus(); return null; };
  const edit=FM.mode==='edit', o=FM.orig||{};
  let sheet=SHEET_OF(FM.kind,FM.day), values={}, moveTo=null;
  const same=(a,b)=>String(a??'').replace(/\s+/g,' ').trim()===String(b??'').replace(/\s+/g,' ').trim();
  const diff=(k,v,ov)=>{ if(!edit||!same(v,ov)) values[k]=v; };   // 只有空白／換行不同不算改
  if(FM.kind==='exp'){
    const item=val('#f-item'), raw=amtVal(), payer=on('#f-payer')[0], share=on('#f-share');
    if(!item) return bad($('#f-item'),'請填項目');
    if(!(raw>0)) return bad($('#f-amt'),'請填金額');
    if(!payer) return bad($('#f-payer'),'請選誰先付的');
    if(!share.length) return bad($('#f-share'),'至少選一個人分攤');
    const tw=FM.cur==='JP'?Math.round(raw*rate()):raw, jy=FM.cur==='JP'?raw:'';
    diff('項目',item,o['項目']);
    if(!edit||tw!==num(o['台幣'])) values.台幣=tw;
    if(!edit||String(jy)!==String(num(o['日幣'])||'')) { if(jy!==''||edit) values.日幣=jy; }
    diff('付款人',payer,(o['付款人']||'').trim());
    MEMBERS.forEach(m=>{ const v=share.includes(m.名稱); if(!edit||v!==bool(o[m.名稱])) values[m.名稱]=v; });
    const d=val('#f-date'); if(!edit||d!==toISO(o['日期'])) { if(d) values.日期=d; }
    LS.set('cruise-payer',payer);
  }else if(FM.kind==='shop'){
    const item=val('#f-item'), img=val('#f-img');
    if(!item) return bad($('#f-item'),'請填商品');
    if(img&&!/^https?:\/\//i.test(img)) return bad($('#f-img'),'圖片網址要 http 開頭');
    diff('商品',item,o['商品']); diff('店家',val('#f-store'),o['店家']||'');
    const who=on('#f-who').join('、'), ow=String(o['誰要的']||'').split(/[、,，\s]+/).filter(Boolean).join('、');
    if(!edit||who!==ow) values.誰要的=who;
    diff('第幾天',on('#f-day')[0]||'',o['第幾天']||''); diff('價格',val('#f-price'),o['價格']||'');
    diff('圖片',img,o['圖片']||''); diff('備註',val('#f-note'),o['備註']||'');
    if($('#f-jp')) diff('日文',val('#f-jp'),o['日文']||'');
  }else{
    const item=val('#f-item'), di=+(on('#f-dayi')[0]??FM.day);
    if(!item) return bad($('#f-item'),'請填行程名稱');
    const hm=v=>v?v.replace(/^0(\d):/,'$1:'):'';
    diff('行程',item,o['行程']);
    diff('抵達時間',hm(val('#f-t1')),edit?hm(toHM(o['抵達時間'])):''); diff('離開時間',hm(val('#f-t2')),edit?hm(toHM(o['離開時間'])):'');
    diff('類型',on('#f-type')[0]||'',(o['類型']||'').trim()); diff('說明',val('#f-desc'),o['說明']||'');
    diff('區域',val('#f-area'),o['區域']||''); diff('地點',val('#f-place'),o['地點']||'');
    const trt=val('#f-trt');
    if(trt&&!/^\d{1,2}:\d{2}$/.test(trt)) return bad($('#f-trt'),'交通時間要像 0:30 這樣');
    diff('交通方式',val('#f-tr'),o['交通方式']||''); diff('交通時間',trt,edit?(String(o['交通時間']||'').match(/\d{1,2}:\d{2}/)||[''])[0]:'');
    diff('備註',val('#f-note'),o['備註']||'');
    if(edit&&di!==FM.day) moveTo=di; else if(!edit) sheet=SHEET_OF('day',di);
    FM.newDay=di;
  }
  if(!edit) Object.keys(values).forEach(k=>{ if(values[k]===''||values[k]===false&&FM.kind!=='exp') delete values[k]; });
  if(edit&&!Object.keys(values).length&&moveTo===null){ closeForm(); toast('沒有改到東西'); return; }
  const go=$('#f-go'); go.disabled=true;
  go.innerHTML=`<span class="spin" style="width:16px;height:16px;border-width:2px;margin:0;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>寫入試算表中…`;
  try{
    let row=FM.row, day=FM.kind==='day'?(FM.newDay??FM.day):0;
    if(!edit){ row=(await callGAS('append',{sheet,values})).row; }
    else{
      const k=KEY_OF[FM.kind];
      if(Object.keys(values).length) await callGAS('update',{sheet,row,expect:{[k]:o[k]},values});
      if(moveTo!==null){
        const r2=await callGAS('moveDay',{from:sheet,row,expect:{行程:values.行程??o['行程']},to:SHEET_OF('day',moveTo)});
        row=r2.row; day=moveTo;
      }
    }
    closeForm();
    toast(edit?(moveTo!==null?`已搬到 D${moveTo+1}`:'已更新試算表'):FM.kind==='exp'?'已記到花費表':FM.kind==='shop'?'已加到購物清單':`已加到 D${day+1}`);
    await reloadAfter(FM.kind,row,day);
  }catch(e2){
    err.textContent=errMsg(e2);
    go.disabled=false; go.innerHTML=ic('check')+(edit?'儲存修改':'再試一次');
  }
}
async function reloadAfter(kind,row,day){

}

      return `<button class="tile${on?' on':''}" data-row="${b._row}" data-col="${esc(BAGWHO)}" data-v="${on?'FALSE':'TRUE'}" data-exp="${on?'TRUE':'FALSE'}">
        <span class="ck">${ic('check')}</span><b>${esc(b['項目'])}</b>${meta(b)?`<small>${meta(b)}</small>`:''}</button>`; }).join('')}</div>`;
    stagger($('#bag-box'),'.tile',30);
    return;
  }
  $('#bag-box').innerHTML=bags.map(b=>`<div class="bag">
      <div class="n">${esc(b['項目'])}${meta(b)?`<small>${meta(b)}</small>`:''}</div>
      <div class="ppl">${ppl.map(n=>n in b
        ? `<button class="pbox${bool(b[n])?' on':''}" data-row="${b._row}" data-col="${esc(n)}"
             data-v="${bool(b[n])?'FALSE':'TRUE'}" data-exp="${bool(b[n])?'TRUE':'FALSE'}">${esc(n)}</button>`
        : '').join('')}</div></div>`).join('');
  stagger($('#bag-box'),'.bag',35);
}
$('#bag-box').onclick=async e=>{
  const b=e.target.closest('.pbox,.tile'); if(!b||b.disabled) return;
  const v=b.dataset.v, who=b.dataset.col, before=bagStats(who);
  b.classList.toggle('on',v==='TRUE'); popEl(b);
  try{
    await callGAS('setCell',{sheet:'行前確認',row:+b.dataset.row,col:who,value:v,expect:b.dataset.exp});
    const row=(DB.all.行前.行李||[]).find(x=>x._row===+b.dataset.row);
    if(row) row[who]=v;
    quiet(()=>{ renderWho(); renderBags(); });
    const after=bagStats(who);
    if(after.t&&after.d===after.t&&before.d<after.t){ confetti(b,46,$('#fx')); toast(`${who} 的行李全部打包好了！`); }
  }catch(err){ b.classList.toggle('on',v!=='TRUE'); toast(errMsg(err),true); }
};
function renderTodos(){
  const lines=((DB.all.行前||{}).資料)||[], tasks=[];
  lines.forEach(t=>{ t=String(t).trim(); if(!t) return;
    if(/^https?:/.test(t)){ if(tasks.length) tasks[tasks.length-1].links.push(t); else tasks.push({t:'',links:[t]}); }
    else tasks.push({t:t.replace(/^\s*\d+\s*[.、)）]\s*/,''),links:[]}); });
  if(!tasks.length){ $('#refs-box').innerHTML=''; return; }
  let st={}; try{ st=JSON.parse(LS.get('cruise-todo')||'{}'); }catch(_){}
  const real=tasks.filter(x=>x.t), done=real.filter(x=>st[x.t]).length;
  const link=u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${ic('ext')}${esc(u.replace(/^https?:\/\//,'').slice(0,42))}</a>`;
  $('#refs-box').innerHTML=`<div class="sh"><div><span class="k">03</span><h3>出發前待辦</h3></div><div class="rl"></div><small>${done} / ${real.length} 完成</small></div>
    <div class="card todos">${tasks.map(x=>x.t
      ?`<div class="todo${st[x.t]?' done':''}"><button class="tk" data-t="${esc(x.t)}" aria-label="完成">${ic('check')}</button>
         <div><span class="tt" data-t="${esc(x.t)}">${esc(x.t)}</span>${x.links.map(link).join('')}</div></div>`
      :`<div class="todo"><span style="width:26px"></span><div>${x.links.map(link).join('')}</div></div>`).join('')}</div>
    <div class="muted" style="font-size:11.5px;margin-top:6px">待辦的勾選只記在這支手機上</div>`;
}
$('#refs-box').onclick=e=>{
  const b=e.target.closest('[data-t]'); if(!b||e.target.closest('a')) return;
  let st={}; try{ st=JSON.parse(LS.get('cruise-todo')||'{}'); }catch(_){}
  st[b.dataset.t]=!st[b.dataset.t]; LS.set('cruise-todo',JSON.stringify(st));
  const was=$$('#refs-box .todo.done').length;
  renderTodos();
  const tk=$(`#refs-box .tk[data-t="${CSS.escape(b.dataset.t)}"]`); popEl(tk);
  const all=$$('#refs-box .tk').length, now=$$('#refs-box .todo.done').length;
  if(now===all&&now>was){ confetti(tk,40,$('#fx')); toast('出發前待辦全部完成！'); }
};
</script>
</body>
</html>
